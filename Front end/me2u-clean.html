<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ME2U — Delivery Escrow Platform</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">
  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">ME2U</div>
      <div class="logo-sub">Delivery Escrow · Zambia</div>
    </div>

    <div class="role-switcher">
      <button class="role-btn buyer active" onclick="switchRole('buyer')">Buyer</button>
      <button class="role-btn seller" onclick="switchRole('seller')">Seller</button>
      <button class="role-btn admin" onclick="switchRole('admin')">Admin</button>
    </div>

    <div class="nav-section" id="nav-section"></div>

    <div class="sidebar-user" id="sidebar-user"></div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div id="header">
      <div id="page-title">Dashboard</div>
      <div class="header-actions" id="header-actions"></div>
      <button class="hbtn settings" onclick="toggleSettings()" title="Settings">⚙</button>
    </div>
    <div id="settings-modal" class="settings-modal hidden">
      <div class="settings-title">Theme</div>
      <div class="theme-options">
        <label class="theme-option active" id="theme-dark-label">
          <input type="radio" name="theme" value="dark" onchange="setTheme('dark')" checked>
          <span>🌙 Dark mode</span>
        </label>
        <label class="theme-option" id="theme-light-label">
          <input type="radio" name="theme" value="light" onchange="setTheme('light')">
          <span>☀️ Light mode</span>
        </label>
      </div>
    </div>
    <div id="content" id="content-area">
      <!-- pages rendered here -->
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="modal-overlay" onclick="closeModal(event)">
  <div id="modal">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div id="modal-actions"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script src="script.js"></script>
</body>
</html>
